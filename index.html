<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eshop Landing Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: olivedrab;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: antiquewhite;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            text-align: center;
            color: chocolate;
        }
        p {
            color: black;
            margin-top: 20px;
        }
        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: blueviolet;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to our e-shop website</h1>
        <img src="cat1.jpeg" alt="Image of cute cat">
        <p>Ismene es lo maximo</p>
        <button onclick="location.href='/products'">Explore Products</button>
    </div>
</body>
</html>
